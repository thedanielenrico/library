<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>My Library</title>
  </head>
  <body>
    <main>
      <dialog id="new-book-dialog">
        <p>Add a new book to your library.</p>
        <form id="new-book-form" method="dialog">
          <div>
            <label for="title">Title:</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Enter a title..."
              required
              minlength="1"
            />
          </div>
          <div>
            <label for="author">Author:</label>
            <input
              type="text"
              id="author"
              name="author"
              placeholder="Enter an author..."
              required
              minlength="2"
            />
          </div>
          <div>
            <label for="numPages">Number of Pages:</label>
            <input
              type="number"
              min="1"
              max="20000"
              id="numPages"
              name="numPages"
              required
            />
          </div>
          <div>
            <label for="read">Read:</label>
            <input type="checkbox" id="read" name="read" />
          </div>
          <div>
            <button value="cancel" formnovalidate>Cancel</button>
            <button id="confirm-add-book" value="confirm">Confirm</button>
          </div>
        </form>
      </dialog>
      <section>
        <button id="open-add-new-book-modal">Add New Book</button>
      </section>
      <section id="card-section"></section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
